# When developing locally with a sibling mcp-schema-evolution clone, the CI workflow
# checks it out before install, and the link: protocol in package.json resolves it.
# Before publishing, ensure @reaatech/mcp-schema-evolution is published to npm first,
# then switch the devDependency in package.json to "^0.1.0" and remove the link: prefix.
packages:
  - '.'
