name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6

      - name: Checkout mcp-schema-evolution
        run: |
          git clone \
            --depth 1 \
            https://x-access-token:${{ secrets.GITHUB_TOKEN }}@github.com/reaatech/mcp-schema-evolution.git \
            ../mcp-schema-evolution

      - uses: pnpm/action-setup@v6

      - uses: actions/setup-node@v6
        with:
          node-version: '22'
          cache: 'pnpm'

      - name: Install dependencies
        run: pnpm install --no-frozen-lockfile

      - name: Build mcp-schema-evolution/core
        run: |
          ln -s "$(pwd)/node_modules" ../mcp-schema-evolution/node_modules
          cd ../mcp-schema-evolution/packages/core && pnpm run build

      - name: Lint
        run: pnpm run lint

      - name: Type check
        run: pnpm run typecheck

      - name: Test
        run: pnpm run test

      - name: Test with coverage
        run: pnpm run test:coverage
